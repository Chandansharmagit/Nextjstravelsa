# Netlify Configuration for Next.js 16 SSR (App Router)
# CRITICAL: No SPA-style redirects when using @netlify/plugin-nextjs

[build]
  # Build command for Next.js
  command = "npm run build"
  
  # Publish directory for Next.js with SSR
  # The @netlify/plugin-nextjs handles routing from .next directory
  publish = ".next"

# ⚠️ CRITICAL: @netlify/plugin-nextjs Plugin
# This plugin MUST be enabled for SSR Next.js apps
# It converts Next.js pages to Netlify Functions and handles ALL routing
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ⚠️ NO SPA REDIRECTS FOR SSR APPS
# DO NOT ADD: [[redirects]] from = "/*" to = "/index.html"
# Why? The plugin intercepts ALL requests and routes them through Next.js runtime
# Adding a catch-all redirect creates a conflict and causes 404 errors

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: API Proxy to Backend (if same domain is required)
# Uncomment ONLY if you need to proxy API requests
# [[redirects]]
#   from = "/api/*"
#   to = "https://backendtsa.travelsansar.com/api/:splat"
#   status = 200
#   force = true
